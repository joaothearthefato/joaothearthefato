<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">João Pedro de Paiva Campos</title>
  <desc id="d">Cabeçalho com o nome, a área de atuação (desenvolvimento web) e o ideograma 極真 sobre um círculo vermelho, em fundo preto.</desc>
  <style>
    .serif { font-family: "Noto Serif", "Source Serif Pro", Georgia, "Times New Roman", serif; }
    .jp    { font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", "Noto Serif CJK JP", serif; }
    .sans  { font-family: "Helvetica Neue", Arial, sans-serif; }
    .name  { opacity: 0; animation: in 1.1s ease-out .2s forwards; }
    .sub   { opacity: 0; animation: in 1.1s ease-out .7s forwards; }
    .rule  { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.2s ease-out .4s forwards; }
    @keyframes in   { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .name, .sub { animation: none; opacity: 1; }
      .rule { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <rect width="900" height="280" fill="#1B1B1B"/>
  <rect x="0" y="0" width="6" height="280" fill="#B7282E"/>

  <!-- selo -->
  <circle cx="770" cy="140" r="100" fill="#B7282E"/>
  <g class="jp" fill="#1B1B1B" font-size="88" font-weight="700" text-anchor="middle">
    <text x="770" y="128">極</text>
    <text x="770" y="214">真</text>
  </g>

  <!-- texto -->
  <text class="sans" x="60" y="82" fill="#B7282E" font-size="13" letter-spacing="4">JACAREÍ · SP · BRASIL</text>
  <g class="name">
    <text class="serif" x="60" y="142" fill="#E5E5E5" font-size="40" font-weight="700">João Pedro</text>
    <text class="serif" x="60" y="190" fill="#E5E5E5" font-size="40" font-weight="400">de Paiva Campos</text>
  </g>
  <line class="rule" x1="60" y1="212" x2="260" y2="212" stroke="#F5D67B" stroke-width="1.5"/>
  <text class="sub sans" x="60" y="240" fill="#E5E5E5" fill-opacity=".75" font-size="15">Desenvolvimento web · front-end e back-end</text>
</svg>
