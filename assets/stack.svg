<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ferramentas</title>
  <desc id="d">Quatro cartões: front-end (HTML, CSS, JavaScript), back-end e banco (PHP, MySQL), fluxo de trabalho (Git, GitHub, Trello) e design e vídeo (Figma, After Effects).</desc>
  <style>
    .sans{font-family:"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,monospace}
    .bob{animation:bob 3s ease-in-out infinite}
    .b2{animation-delay:.4s}.b3{animation-delay:.8s}.b4{animation-delay:1.2s}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){.bob{animation:none}}
  </style>
  <g class="sans">
    <g class="bob">
      <rect x="1" y="1" width="204" height="208" rx="12" fill="#1B1B1B" stroke="#B7282E" stroke-width="1.5"/>
      <text class="mono" x="102" y="62" fill="#F5D67B" font-size="34" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
      <text x="102" y="102" fill="#E5E5E5" font-size="18" font-weight="700" text-anchor="middle">Front-end</text>
      <text x="102" y="136" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">HTML</text>
      <text x="102" y="160" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">CSS</text>
      <text x="102" y="184" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">JavaScript</text>
    </g>
    <g class="bob b2">
      <rect x="232" y="1" width="204" height="208" rx="12" fill="#1B1B1B" stroke="#B7282E" stroke-width="1.5"/>
      <g fill="none" stroke="#F5D67B" stroke-width="2.5">
        <ellipse cx="334" cy="30" rx="22" ry="8"/>
        <path d="M312 30v22c0 4.5 10 8 22 8s22-3.500 22-8V30"/>
        <path d="M312 41c0 4.500 10 8 22 8s22-3.500 22-8"/>
      </g>
      <text x="334" y="102" fill="#E5E5E5" font-size="18" font-weight="700" text-anchor="middle">Back-end e banco</text>
      <text x="334" y="136" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">PHP</text>
      <text x="334" y="160" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">MySQL</text>
    </g>
    <g class="bob b3">
      <rect x="464" y="1" width="204" height="208" rx="12" fill="#1B1B1B" stroke="#B7282E" stroke-width="1.5"/>
      <g fill="none" stroke="#F5D67B" stroke-width="2.5">
        <circle cx="556" cy="22" r="6"/><circle cx="556" cy="56" r="6"/><circle cx="582" cy="38" r="6"/>
        <path d="M556 28v22M556 44c0-6 26-2 26-0"/>
      </g>
      <text x="566" y="102" fill="#E5E5E5" font-size="18" font-weight="700" text-anchor="middle">Fluxo de trabalho</text>
      <text x="566" y="136" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">Git e GitHub</text>
      <text x="566" y="160" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">Trello</text>
      <text x="566" y="184" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">Scrum e Kanban</text>
    </g>
    <g class="bob b4">
      <rect x="696" y="1" width="204" height="208" rx="12" fill="#1B1B1B" stroke="#B7282E" stroke-width="1.5"/>
      <circle cx="798" cy="38" r="24" fill="#B7282E"/>
      <path d="M791 27l18 11-18 11z" fill="#1B1B1B"/>
      <text x="798" y="102" fill="#E5E5E5" font-size="18" font-weight="700" text-anchor="middle">Design e vídeo</text>
      <text x="798" y="136" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">Figma</text>
      <text x="798" y="160" fill="#E5E5E5" fill-opacity=".85" font-size="16" text-anchor="middle">After Effects</text>
    </g>
