<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Oyama Hub — ver o repositório</title>
  <desc id="d">Cartão do projeto Oyama Hub com um esquema de quatro camadas: entrada pública, infraestrutura (sessão, autenticação e CSRF), áreas do aluno e do admin, e banco de dados MySQL.</desc>
  <style>
    .serif{font-family:"Noto Serif",Georgia,"Times New Roman",serif}
    .sans{font-family:"Helvetica Neue",Arial,sans-serif}
    .flow{stroke-dasharray:6 6;animation:go 1.2s linear infinite}
    @keyframes go{to{stroke-dashoffset:-12}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect x="1" y="1" width="898" height="338" rx="14" fill="#1B1B1B" stroke="#B7282E" stroke-width="2"/>
  <rect x="1" y="1" width="8" height="338" rx="4" fill="#B7282E"/>
  <text class="sans" x="40" y="48" fill="#B7282E" font-size="14" letter-spacing="4">PROJETO EM DESTAQUE</text>
  <text class="serif" x="40" y="100" fill="#E5E5E5" font-size="44" font-weight="700">Oyama Hub</text>
  <text class="sans" x="40" y="132" fill="#E5E5E5" fill-opacity=".8" font-size="18">Treinos, Katas e Kihons para quem pratica Kyokushin</text>
  <text class="sans" x="640" y="100" fill="#F5D67B" font-size="20" font-weight="700">Ver o código →</text>
  <line x1="640" y1="110" x2="780" y2="110" stroke="#F5D67B" stroke-width="1.5"/>

  <text class="sans" x="40" y="186" fill="#E5E5E5" fill-opacity=".55" font-size="13" letter-spacing="3">COMO OS PEDAÇOS SE ENCAIXAM</text>

  <g class="sans" font-size="15">
    <rect x="36" y="206" width="180" height="96" rx="8" fill="#262626" stroke="#F5D67B" stroke-opacity=".5"/>
    <text x="126" y="240" fill="#F5D67B" font-size="19" font-weight="700" text-anchor="middle">Entrada</text>
    <text x="126" y="266" fill="#E5E5E5" text-anchor="middle">index · login</text>
    <text x="126" y="285" fill="#E5E5E5" text-anchor="middle">registro</text>

    <rect x="252" y="206" width="180" height="96" rx="8" fill="#262626" stroke="#F5D67B" stroke-opacity=".5"/>
    <text x="342" y="240" fill="#F5D67B" font-size="19" font-weight="700" text-anchor="middle">Infra</text>
    <text x="342" y="266" fill="#E5E5E5" text-anchor="middle">sessão · auth</text>
    <text x="342" y="285" fill="#E5E5E5" text-anchor="middle">CSRF</text>

    <rect x="468" y="206" width="180" height="96" rx="8" fill="#262626" stroke="#F5D67B" stroke-opacity=".5"/>
    <text x="558" y="240" fill="#F5D67B" font-size="19" font-weight="700" text-anchor="middle">Aluno e Admin</text>
    <text x="558" y="266" fill="#E5E5E5" text-anchor="middle">treinos · painel</text>
    <text x="558" y="285" fill="#E5E5E5" text-anchor="middle">API do admin</text>

    <rect x="684" y="206" width="180" height="96" rx="8" fill="#262626" stroke="#B7282E"/>
    <text x="774" y="240" fill="#F5D67B" font-size="19" font-weight="700" text-anchor="middle">Dados</text>
    <text x="774" y="266" fill="#E5E5E5" text-anchor="middle">MySQL</text>
    <text x="774" y="285" fill="#E5E5E5" text-anchor="middle">migrations</text>
  </g>
  <g stroke="#B7282E" stroke-width="2.5" fill="none" class="flow">
    <line x1="218" y1="254" x2="250" y2="254"/>
    <line x1="434" y1="254" x2="466" y2="254"/>
    <line x1="650" y1="254" x2="682" y2="254"/>
  </g>
</svg>
