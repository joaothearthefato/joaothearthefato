<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Linha do tempo</title>
  <desc id="d">Janeiro de 2025: início do técnico no SESI/SENAI. Durante o curso: Oyama Hub, em grupo. Dezembro de 2026: formatura prevista. Depois: procurando a primeira vaga júnior.</desc>
  <style>
    .sans{font-family:"Helvetica Neue",Arial,sans-serif}
    .pulse{transform-origin:790px 70px;animation:p 2.2s ease-out infinite}
    @keyframes p{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
    @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
  </style>
  <line x1="110" y1="70" x2="790" y2="70" stroke="#B7282E" stroke-width="3"/>
  <line x1="570" y1="70" x2="790" y2="70" stroke="#1B1B1B" stroke-width="5"/>
  <line x1="570" y1="70" x2="790" y2="70" stroke="#B7282E" stroke-width="2" stroke-dasharray="3 7"/>
  <g class="sans" text-anchor="middle">
    <circle cx="110" cy="70" r="11" fill="#B7282E"/>
    <text x="110" y="112" fill="#F5D67B" font-size="17" font-weight="700">Jan 2025</text>
    <text x="110" y="136" fill="#E5E5E5" font-size="15">Começo do técnico</text>
    <text x="110" y="156" fill="#E5E5E5" font-size="15">no SESI/SENAI</text>

    <circle cx="330" cy="70" r="11" fill="#B7282E"/>
    <text x="330" y="112" fill="#F5D67B" font-size="17" font-weight="700">Durante o curso</text>
    <text x="330" y="136" fill="#E5E5E5" font-size="15">Oyama Hub,</text>
    <text x="330" y="156" fill="#E5E5E5" font-size="15">feito em grupo</text>

    <circle cx="570" cy="70" r="11" fill="#B7282E"/>
    <text x="570" y="112" fill="#F5D67B" font-size="17" font-weight="700">Dez 2026</text>
    <text x="570" y="136" fill="#E5E5E5" font-size="15">Formatura</text>
    <text x="570" y="156" fill="#E5E5E5" font-size="15">prevista</text>

    <circle class="pulse" cx="790" cy="70" r="11" fill="none" stroke="#F5D67B" stroke-width="2"/>
    <circle cx="790" cy="70" r="11" fill="#1B1B1B" stroke="#F5D67B" stroke-width="3"/>
    <text x="790" y="112" fill="#F5D67B" font-size="17" font-weight="700">Próximo passo</text>
    <text x="790" y="136" fill="#E5E5E5" font-size="15">Primeira vaga</text>
    <text x="790" y="156" fill="#E5E5E5" font-size="15">júnior em web</text>
  </g>
</svg>
